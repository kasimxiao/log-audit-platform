-size="12" fill="#0b0b0b">下载包，按 manifest 逐成员处理（utmp 解码 / lastlog / 文本拆行）</text><path d="M852.8571428571428,524 h-40 v14 h36" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#mseq1)"></path><text x="806.8571428571428" y="534" font-size="12" fill="#0b0b0b" text-anchor="end">解析事件时间（按主机时区）+ 按日志类型预解析 fields</text><line x1="852.8571428571428" y1="566" x2="703.4285714285713" y2="566" stroke="#52514e" stroke-width="1.3" marker-end="url(#mseq1)"></line><text x="777.1428571428571" y="560" text-anchor="middle" font-size="12" fill="#0b0b0b">写 Parquet：hostlogs/dt/instance_id/logtype/；二进制原文件写 raw/</text><path d="M852.8571428571428,592 h-40 v14 h36" fill="none" stroke="#52514e" stroke-width="1.3" marker-end="url(#mseq1)"></path><text x="806.8571428571428" y="602" font-size="12" fill="#0b0b0b" text-anchor="end">向 Glue 登记新分区</text><line x1="852.8571428571428" y1="634" x2="1002.2857142857141" y2="634" stroke="#52514e" stroke-width="1.3" marker-end="url(#mseq1)"></line><text x="928.5714285714284" y="628" text-anchor="middle" font-size="12" fill="#0b0b0b">同步记录 → 已入库（行数、各路径行数、缺失路径）</text><line x1="852.8571428571428" y1="668" x2="703.4285714285713" y2="668" stroke="#52514e" stroke-width="1.3" marker-end="url(#mseq1)"></line><text x="777.1428571428571" y="662" text-anchor="middle" font-size="12" fill="#0b0b0b">删除 staging 包</text></svg>